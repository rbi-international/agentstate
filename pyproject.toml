[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentstate"
version = "0.1.0"
description = "Execution-state representation research for LLM agents"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2,<3",
    "jsonschema>=4,<5",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentstate*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
